<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const theme = window.__GP_HELPER_THEME__ || "system";
      const systemTheme = matchMedia("(prefers-color-scheme: dark)");
      const applyTheme = () => {
        document.documentElement.dataset.theme =
          theme === "system" ? (systemTheme.matches ? "dark" : "light") : theme;
      };
      applyTheme();
      if (theme === "system") systemTheme.addEventListener("change", applyTheme);
    </script>
    <link rel="icon" type="image/svg+xml" href="/src/assets/icon-small.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPGUI Downloader</title>
  </head>
  <body>
    <script>
      /* workaround to webview font size auto scaling */
      var htmlFontSize = getComputedStyle(document.documentElement).fontSize;
      var ratio = parseInt(htmlFontSize, 10) / 16;
      document.documentElement.style.fontSize = 16 / ratio + "px";
    </script>
    <div id="root" data-tauri-drag-region></div>
    <script type="module" src="/src/pages/main.tsx"></script>
  </body>
</html>
