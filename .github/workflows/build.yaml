name: Build
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel. Stable builds require matching vX.Y.Z refs in both repositories.'
        required: true
        default: snapshot
        type: choice
        options: [snapshot, stable]
      build_only:
        description: 'Build and test artifacts without publishing releases, images, or update feeds'
        required: true
        default: false
        type: boolean
      gp_branch:
        description: 'GlobalProtect-openconnect ref to build (use the matching tag for stable builds)'
        required: true
        default: dev
      gpgui_branch:
        description: 'gpgui ref to build (use the matching tag for stable builds)'
        required: true
        default: dev
      build_macos:
        description: 'Build Apple Silicon artifacts for this run'
        required: true
        default: false
        type: boolean
      build_bsd:
        description: 'Build FreeBSD/OpenBSD packages for this run'
        required: true
        default: false
        type: boolean
      build_bsd_arm64:
        description: 'Build optional FreeBSD/OpenBSD arm64 packages for this run. Slow and disabled by default'
        required: true
        default: false
        type: boolean
  push:
    paths-ignore:
      - LICENSE
      - "*.md"
      - .vscode
      - .devcontainer
    branches:
      - main
      - hotfix/*
      - feature/*
      - release/*
    tags:
      - v*.*.*

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && (inputs.build_only && github.run_id || 'release') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
    - name: Validate stable refs
      env:
        EVENT: ${{ github.event_name }}
        CHANNEL: ${{ inputs.channel }}
        GP_REF: ${{ inputs.gp_branch }}
        GPGUI_REF: ${{ inputs.gpgui_branch }}
      run: |
        if [[ "$EVENT" == workflow_dispatch && "$CHANNEL" == stable ]]; then
          if [[ ! "$GP_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$GP_REF" != "$GPGUI_REF" ]]; then
            echo "Stable builds require matching vX.Y.Z refs" >&2
            exit 1
          fi
        fi

  test-gp:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        submodules: recursive
    - name: Run Rust tests as a non-root user with focused privilege checks
      run: |
        docker run --rm \
          --user vscode \
          -e HOME=/home/vscode \
          -e CARGO_TARGET_DIR=/tmp/gp-test-target \
          -e COREPACK_INTEGRITY_KEYS=0 \
          -e LIBXML2_STATIC=1 \
          -v "$(pwd):/workspace:ro" \
          -w /workspace \
          yuezk/gpdev:binary-builder-tauri2 \
          sh -ec '
            test "$(id -u)" -ne 0
            # Tauri generates schemas in the source tree. Keep the host checkout read-only.
            cp -R /workspace /tmp/gp-test-workspace
            cd /tmp/gp-test-workspace
            cargo test --workspace --locked

            # Exercise only the paths that require an actual root process.
            sudo -E env PATH="$PATH" PKEXEC_UID="$(id -u)" cargo test --locked -p gpapi \
              process::auth_launcher::tests::custom_authenticator_crash_does_not_request_recovery -- --exact
            sudo -E env PATH="$PATH" PKEXEC_UID="$(id -u)" cargo test --locked -p gpapi \
              process::collection::tests::root_owned_sticky_directories_protect_collectors_without_trusting_writable_files -- --exact
            sudo -E env PATH="$PATH" PKEXEC_UID="$(id -u)" cargo test --locked -p gpservice \
              --bin gpservice device_anchor::tests
          '

  tarball:
    needs: validate-inputs
    runs-on: ubuntu-latest
    steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 9
    - name: Prepare workspace
      run: rm -rf source && mkdir -p source/artifacts

    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        path: source/gp
        submodules: recursive

    - name: Create tarball
      env:
        IS_SNAPSHOT: ${{ (github.event_name == 'workflow_dispatch' && inputs.channel == 'snapshot') || (github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')) }}
      run: |
        cd source/gp
        # Stable manual builds use tagged source even when dispatched from main.
        if [[ "$IS_SNAPSHOT" == true ]]; then
          touch SNAPSHOT
        fi
        make tarball

        mv -v .build/tarball/*.tar.gz ../artifacts/

    - name: Generate RPM spec file
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' && inputs.gp_branch || 'snapshot') || github.ref_name }}
      run: |
        cd source/gp

        make init-rpm \
          REVISION='1%{?dist}' \
          RPM_SOURCE=https://github.com/yuezk/GlobalProtect-openconnect/releases/download/${RELEASE_TAG}/%{name}-%{version}.tar.gz

        mv -v .build/rpm/*.spec ../artifacts/

    - name: Upload tarball
      uses: actions/upload-artifact@v7
      with:
        name: artifact-source
        if-no-files-found: error
        path: |
          source/artifacts/*

  tarball-offline:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs:
    - tarball
    steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 9

    - name: Prepare workspace
      run: rm -rf source-offline && mkdir source-offline

    - name: Download tarball
      uses: actions/download-artifact@v8
      with:
        name: artifact-source
        path: source-offline

    - name: Create offline tarball
      run: |
        cd source-offline

        offline_tarball=$(basename *.tar.gz .tar.gz).offline.tar.gz

        # Extract the tarball
        tar -xzf *.tar.gz

        cd */
        make tarball OFFLINE=1

        # Rename the tarball to .offline.tar.gz
        mv -v .build/tarball/*.tar.gz ../$offline_tarball

    - name: Upload offline tarball
      uses: actions/upload-artifact@v7
      with:
        path: source-offline/*.offline.tar.gz
        name: artifact-source-offline
        if-no-files-found: error

  build-gp:
    if: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable')) }}
    needs:
    - tarball
    strategy:
      fail-fast: false
      matrix:
        os:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: ubuntu-24.04-arm
        package: [deb, rpm, pkg, apk, binary, ubuntu-rolling]
    runs-on: ${{ matrix.os.runner }}
    name: build-gp (${{ matrix.package }}, ${{ matrix.os.arch }})
    steps:
    - name: Prepare workspace
      run: |
        rm -rf build-gp-${{ matrix.package }}
        mkdir -p build-gp-${{ matrix.package }}
    - name: Download tarball
      uses: actions/download-artifact@v8
      with:
        name: artifact-source
        path: build-gp-${{ matrix.package }}
    - name: Build ${{ matrix.package }} package in Docker
      # LIBXML2_STATIC is needed to avoid the dynamic linking issue on different distros
      run: |
        docker run --rm \
          -e COREPACK_INTEGRITY_KEYS=0 \
          -e LIBXML2_STATIC=1 \
          -v $(pwd)/build-gp-${{ matrix.package }}:/workspace \
          yuezk/gpdev:${{ matrix.package }}-builder-tauri2
    - name: Install ${{ matrix.package }} package in Docker
      run: |
        docker run --rm \
          -e COREPACK_INTEGRITY_KEYS=0 \
          -e GPGUI_INSTALLED=0 \
          -v $(pwd)/build-gp-${{ matrix.package }}:/workspace \
          yuezk/gpdev:${{ matrix.package }}-builder-tauri2 \
          bash install.sh
    # Don't upload package for ubuntu-rolling because it's duplicate of deb package
    - name: Upload ${{ matrix.package }} package
      if: ${{ matrix.package != 'ubuntu-rolling' }}
      uses: actions/upload-artifact@v7
      with:
        name: artifact-gp-${{ matrix.package }}-${{ matrix.os.arch }}
        if-no-files-found: error
        path: |
          build-gp-${{ matrix.package }}/artifacts/*

  build-docker-image:
    if: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Prepare
      run: |
        platform=${{ matrix.platform }}
        echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        submodules: recursive
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    - name: Build and push by digest
      if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: packaging/docker/alpine/Dockerfile
        platforms: ${{ matrix.platform }}
        outputs: type=image,name=yuezk/globalprotect-openconnect,push-by-digest=true,name-canonical=true,push=true
    - name: Build local image for verification
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
      uses: docker/build-push-action@v7
      with:
        context: .
        file: packaging/docker/alpine/Dockerfile
        platforms: ${{ matrix.platform }}
        tags: yuezk/globalprotect-openconnect:build-test
        load: true
        push: false
    - name: Verify CLI tools
      env:
        IMAGE: yuezk/globalprotect-openconnect
        DIGEST: ${{ steps.build.outputs.digest }}
        BUILD_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_only }}
      run: |
        image_ref="$IMAGE@$DIGEST"
        if [[ "$BUILD_ONLY" == "true" ]]; then
          image_ref="$IMAGE:build-test"
        fi
        docker run --rm "$image_ref" --help
        docker run --rm --entrypoint gpauth "$image_ref" --help
        docker run --rm --entrypoint sh "$image_ref" -lc 'test "$(id -u gp)" = "1000" && test "$SUDO_UID" = "1000"'
    - name: Export digest
      if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
    - name: Upload digest
      if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_only }}
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ env.PLATFORM_PAIR }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1

  build-gpgui-glibc:
    needs: validate-inputs
    name: build-gpgui (glibc)
    uses: ./.github/workflows/build-gpgui-linux.yaml
    with:
      gp_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
      gpgui_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gpgui_branch || github.ref_name }}
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
      builder: gpgui-builder-tauri2
      verify_desktop_assets: true
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  build-gpgui-musl:
    needs: validate-inputs
    name: build-gpgui (musl)
    uses: ./.github/workflows/build-gpgui-linux.yaml
    with:
      gp_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
      gpgui_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gpgui_branch || github.ref_name }}
      channel: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
      builder: gpgui-alpine-builder-tauri2
      artifact_suffix: -musl
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}

  nix-source:
    needs: [build-gpgui-glibc]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            system: x86_64-linux
            artifact_arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            artifact_arch: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    name: nix-source (${{ matrix.platform.system }})
    env:
      NIX_SYSTEM: ${{ matrix.platform.system }}
      NIXPKGS: locked
    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
          submodules: recursive
          path: gp
      - name: Download current GUI artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-gpgui-${{ matrix.platform.artifact_arch }}
          path: nix-artifacts/gui
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure current source and GUI inputs
        run: |
          echo "GP_SOURCE=$PWD/gp" >> "$GITHUB_ENV"
          gui_archive=$(find "$PWD/nix-artifacts/gui" -name '*.bin.tar.xz' -type f)
          test -f "$gui_archive"
          echo "GP_GUI_ARCHIVE=$gui_archive" >> "$GITHUB_ENV"
      - name: Build source package
        run: |
          nix build --impure --file gp/nix/ci.nix source \
            --extra-experimental-features "nix-command flakes" --print-build-logs
          bash gp/scripts/tests/nix-desktop-authorization.sh result
      - name: Test source runtime in NixOS
        if: matrix.platform.system == 'x86_64-linux'
        run: |
          nix build --impure --file gp/nix/ci.nix runtime-source \
            --extra-experimental-features "nix-command flakes" --print-build-logs

  nix-prebuilt:
    needs: [build-gp, build-gpgui-glibc]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            system: x86_64-linux
            artifact_arch: amd64
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            artifact_arch: ubuntu-24.04-arm
        nixpkgs: [locked, nixos-25.11, nixos-26.05, nixpkgs-unstable]
    runs-on: ${{ matrix.platform.runner }}
    name: nix-prebuilt (${{ matrix.platform.system }}, ${{ matrix.nixpkgs }})
    env:
      NIX_SYSTEM: ${{ matrix.platform.system }}
      NIXPKGS: ${{ matrix.nixpkgs }}
    steps:
      - name: Checkout packaging and tests
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
          submodules: recursive
          path: gp
      - name: Download current Linux binary artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-gp-binary-${{ matrix.platform.artifact_arch }}
          path: nix-artifacts/binaries
      - name: Download current GUI artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-gpgui-${{ matrix.platform.artifact_arch }}
          path: nix-artifacts/gui
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure current artifact inputs
        run: |
          echo "GP_SOURCE=$PWD/gp" >> "$GITHUB_ENV"
          binary_archive=$(find "$PWD/nix-artifacts/binaries" -name '*.bin.tar.xz' -type f)
          gui_archive=$(find "$PWD/nix-artifacts/gui" -name '*.bin.tar.xz' -type f)
          test -f "$binary_archive"
          test -f "$gui_archive"
          echo "GP_BINARY_ARCHIVE=$binary_archive" >> "$GITHUB_ENV"
          echo "GP_GUI_ARCHIVE=$gui_archive" >> "$GITHUB_ENV"
      - name: Build package through host NixOS module
        run: |
          nix build --impure --file gp/nix/ci.nix module \
            --extra-experimental-features "nix-command flakes" --print-build-logs
          bash gp/scripts/tests/nix-desktop-authorization.sh result
      - name: Build standalone prebuilt package
        if: matrix.nixpkgs == 'locked'
        run: |
          nix build --impure --file gp/nix/ci.nix prebuilt \
            --extra-experimental-features "nix-command flakes" --print-build-logs
      - name: Test prebuilt runtime in NixOS
        if: matrix.nixpkgs == 'locked' && matrix.platform.system == 'x86_64-linux'
        run: |
          nix build --impure --file gp/nix/ci.nix runtime-prebuilt \
            --extra-experimental-features "nix-command flakes" --print-build-logs

  trigger-gpgui-macos:
    needs: test-gp
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_macos) || (startsWith(github.ref, 'refs/tags/') && vars.BUILD_MACOS_ON_TAG == 'true') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: trigger private macOS build
    outputs:
      run_id: ${{ steps.dispatch.outputs.run_id }}
      run_url: ${{ steps.dispatch.outputs.run_url }}
    steps:
      - name: Dispatch private macOS build
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GPGUI_ACTIONS_TOKEN }}
          PUBLIC_GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' && inputs.gp_branch || 'snapshot') || github.ref_name }}
          GP_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref_name }}
          GPGUI_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.gpgui_branch || github.ref_name }}
          BUILD_VERSION: ${{ github.run_number }}.${{ github.run_attempt }}
          REQUEST_ID: ${{ github.run_id }}.${{ github.run_attempt }}.macos
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "GPGUI_ACTIONS_TOKEN is not configured" >&2
            exit 1
          fi

          gp_ref_path="$(jq -rn --arg ref "$GP_REF" '$ref | @uri')"
          gpgui_ref_path="$(jq -rn --arg ref "$GPGUI_REF" '$ref | @uri')"
          gp_sha="$(GH_TOKEN="$PUBLIC_GH_TOKEN" gh api \
            "repos/yuezk/GlobalProtect-openconnect/commits/$gp_ref_path" --jq .sha)"
          gpgui_sha="$(gh api "repos/yuezk/gpgui/commits/$gpgui_ref_path" --jq .sha)"
          if [[ -z "$gp_sha" || -z "$gpgui_sha" ]]; then
            echo "Could not resolve release source refs" >&2
            exit 1
          fi

          expected_title="macOS build $CHANNEL $RELEASE_TAG ($REQUEST_ID)"
          jq -n \
            --arg workflow_ref "$GPGUI_REF" \
            --arg request_id "$REQUEST_ID" \
            --arg build_version "$BUILD_VERSION" \
            --arg channel "$CHANNEL" \
            --arg release_tag "$RELEASE_TAG" \
            --arg gp_ref "$gp_sha" \
            --arg gpgui_ref "$gpgui_sha" \
            '{
              ref: $workflow_ref,
              inputs: {
                request_id: $request_id,
                build_version: $build_version,
                channel: $channel,
                release_tag: $release_tag,
                gp_ref: $gp_ref,
                gpgui_ref: $gpgui_ref
              }
            }' | gh api --method POST \
              repos/yuezk/gpgui/actions/workflows/build-macos.yaml/dispatches \
              --input -

          run_id=""
          run_url=""
          for _ in {1..40}; do
            runs="$(gh api \
              'repos/yuezk/gpgui/actions/workflows/build-macos.yaml/runs?event=workflow_dispatch&per_page=50')"
            run_id="$(jq -r --arg title "$expected_title" \
              '[.workflow_runs[] | select(.display_title == $title)] | first | .id // empty' \
              <<<"$runs")"
            run_url="$(jq -r --arg title "$expected_title" \
              '[.workflow_runs[] | select(.display_title == $title)] | first | .html_url // empty' \
              <<<"$runs")"
            if [[ -n "$run_id" ]]; then
              {
                echo "run_id=$run_id"
                echo "run_url=$run_url"
              } >> "$GITHUB_OUTPUT"
              echo "Triggered private workflow: $run_url"
              exit 0
            fi
            sleep 3
          done

          echo "Could not locate the dispatched private workflow run" >&2
          exit 1

  setup-bsd-matrix:
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.matrix.outputs.enabled }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - name: Build matrix
      id: matrix
      env:
        BUILD_BSD_ON_TAG: ${{ startsWith(github.ref, 'refs/tags/') && vars.BUILD_BSD_ON_TAG == 'true' }}
        BUILD_BSD: ${{ github.event_name == 'workflow_dispatch' && inputs.build_bsd }}
        BUILD_BSD_ARM64: ${{ github.event_name == 'workflow_dispatch' && inputs.build_bsd_arm64 }}
      run: |
        python3 - <<'PY'
        import json
        import os

        build_bsd = os.environ["BUILD_BSD_ON_TAG"] == "true" or os.environ["BUILD_BSD"] == "true"
        build_bsd_arm64 = os.environ["BUILD_BSD_ARM64"] == "true"
        include = []

        def add(os_name, arch):
            include.append({
                "os": os_name,
                "arch": arch,
                "workspace": f"{os_name}-{arch}-source",
                "artifact": f"artifact-bsd-{os_name}-{arch}",
                "package_target": f"package-{os_name}",
                "artifact_dir": os_name,
            })

        if build_bsd:
            add("freebsd", "x86_64")
            add("openbsd", "x86_64")
        if build_bsd_arm64:
            add("freebsd", "arm64")
            add("openbsd", "arm64")

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"enabled={str(bool(include)).lower()}\n")
            output.write(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}\n")
        PY

  build-gpgui-frontend:
    needs: setup-bsd-matrix
    if: ${{ needs.setup-bsd-matrix.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: pnpm/action-setup@v5
      with:
        version: 9
    - name: Prepare workspace
      run: rm -rf gpgui-frontend && mkdir gpgui-frontend
    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        path: gpgui-frontend/gp
        submodules: recursive
    - name: Checkout gpgui
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/gpgui
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gpgui_branch || github.ref_name }}
        path: gpgui-frontend/gpgui
    - name: Build gpgui frontend
      run: |
        cd gpgui-frontend/gpgui/apps/desktop
        pnpm install --frozen-lockfile
        pnpm build
    - name: Upload gpgui frontend
      uses: actions/upload-artifact@v7
      with:
        name: bsd-gpgui-frontend
        if-no-files-found: error
        path: gpgui-frontend/gpgui/apps/desktop/dist/**

  build-bsd:
    needs:
      - setup-bsd-matrix
      - build-gpgui-frontend
    if: ${{ needs.setup-bsd-matrix.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    name: build-${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-bsd-matrix.outputs.matrix) }}
    steps:
    - name: Prepare workspace
      run: rm -rf "${{ matrix.workspace }}" && mkdir "${{ matrix.workspace }}"
    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        path: ${{ matrix.workspace }}/gp
        submodules: recursive
    - name: Checkout gpgui
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/gpgui
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gpgui_branch || github.ref_name }}
        path: ${{ matrix.workspace }}/gpgui
    - name: Download gpgui frontend
      uses: actions/download-artifact@v8
      with:
        name: bsd-gpgui-frontend
        path: ${{ matrix.workspace }}/gpgui/apps/desktop/dist
    - name: Build on FreeBSD
      if: ${{ matrix.os == 'freebsd' }}
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14.4"
        arch: ${{ matrix.arch }}
        usesh: true
        prepare: |
          pkg install -y \
            git \
            rust \
            libiconv \
            gettext-tools \
            autoconf \
            automake \
            libtool \
            patch \
            gmake \
            pkgconf \
            libxml2 \
            gnutls \
            p11-kit \
            nettle \
            gmp \
            gnome-keyring \
            libayatana-appindicator \
            polkit \
            webkit2-gtk_41
        run: |
          set -eu
          export GPGUI_BUILD_VERSION=${{ github.run_number }}.${{ github.run_attempt }}
          export GPGUI_UPDATE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
          export GPGUI_LICENSE_SIGNING_KEYS='${{ vars.GPGUI_LICENSE_SIGNING_KEYS }}'

          cd "${{ matrix.workspace }}/gp"
          cargo build --release --workspace

          cd ../gpgui/apps/desktop/src-tauri
          cargo build --release --workspace

          cd ../../../../gp
          gmake "${{ matrix.package_target }}" GPGUI_BINARY=../gpgui/target/release/gpgui
          pkg install -y ".build/${{ matrix.artifact_dir }}"/artifacts/*.pkg
          gpclient --version
          gpauth --version
          gpgui --version
          rm -rf target ../gpgui/target
          find ".build/${{ matrix.artifact_dir }}" -mindepth 1 -maxdepth 1 ! -name artifacts -exec rm -rf {} +
    - name: Build on OpenBSD
      if: ${{ matrix.os == 'openbsd' }}
      uses: vmactions/openbsd-vm@v1
      with:
        release: "7.9"
        arch: ${{ matrix.arch }}
        usesh: true
        prepare: |
          set -eu
          pkg_add -u -I
          pkg_add -I \
            git \
            rust \
            libiconv \
            gettext-tools \
            autoconf%2.72 \
            automake%1.17 \
            libtool \
            gmake \
            libxml \
            gnutls \
            p11-kit \
            gmp \
            lz4 \
            dbus \
            gnome-keyring \
            polkit \
            webkitgtk41 \
            xdg-utils
          ln -sf /usr/local/bin/autoreconf-2.72 /usr/local/bin/autoreconf
          ln -sf /usr/local/bin/autoconf-2.72 /usr/local/bin/autoconf
          ln -sf /usr/local/bin/autoheader-2.72 /usr/local/bin/autoheader
          ln -sf /usr/local/bin/autom4te-2.72 /usr/local/bin/autom4te
          ln -sf /usr/local/bin/aclocal-1.17 /usr/local/bin/aclocal
          ln -sf /usr/local/bin/automake-1.17 /usr/local/bin/automake
        run: |
          set -eu
          export AUTOCONF_VERSION=2.72
          export AUTOMAKE_VERSION=1.17
          export GPGUI_BUILD_VERSION=${{ github.run_number }}.${{ github.run_attempt }}
          export GPGUI_UPDATE_CHANNEL=${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'stable' }}
          export GPGUI_LICENSE_SIGNING_KEYS='${{ vars.GPGUI_LICENSE_SIGNING_KEYS }}'

          cd "${{ matrix.workspace }}/gp"
          cargo build --release --workspace

          cd ../gpgui/apps/desktop/src-tauri
          cargo build --release --workspace

          cd ../../../../gp
          gmake "${{ matrix.package_target }}" GPGUI_BINARY=../gpgui/target/release/gpgui
          pkg_add -D unsigned ".build/${{ matrix.artifact_dir }}"/artifacts/*.tgz
          gpclient --version
          gpauth --version
          gpgui --version
          rm -rf target ../gpgui/target
          find ".build/${{ matrix.artifact_dir }}" -mindepth 1 -maxdepth 1 ! -name artifacts -exec rm -rf {} +
    - name: Upload BSD package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact }}
        if-no-files-found: error
        path: |
          ${{ matrix.workspace }}/gp/.build/${{ matrix.artifact_dir }}/artifacts/*

  gh-release:
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && !inputs.build_only) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    needs:
      - test-gp
      - nix-source
      - nix-prebuilt
      - tarball
      - tarball-offline
      - build-gp
      - build-docker-image
      - build-gpgui-glibc
      - build-gpgui-musl
      - setup-bsd-matrix
      - build-gpgui-frontend
      - build-bsd

    steps:
    - name: Check required jobs
      env:
        NEEDS_JSON: ${{ toJson(needs) }}
        BSD_MATRIX_ENABLED: ${{ needs.setup-bsd-matrix.outputs.enabled }}
        IS_STABLE: ${{ (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable')) }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import sys

        needs = json.loads(os.environ["NEEDS_JSON"])
        bsd_matrix_enabled = os.environ["BSD_MATRIX_ENABLED"] == "true"
        is_stable = os.environ["IS_STABLE"] == "true"
        failed = []

        for name, data in needs.items():
            result = data["result"]
            if result in {"failure", "cancelled"}:
                failed.append(f"{name}: {result}")
            elif name in {"build-gp", "build-docker-image", "nix-prebuilt"} and result == "skipped" and is_stable:
                continue
            elif name in {"build-gpgui-frontend", "build-bsd"} and result == "skipped" and not bsd_matrix_enabled:
                continue
            elif result == "skipped":
                failed.append(f"{name}: {result}")

        if failed:
            print("Required jobs did not complete successfully:")
            for item in failed:
                print(f"  - {item}")
            sys.exit(1)
        PY

    - name: Prepare workspace
      run: rm -rf gh-release && mkdir gh-release

    - name: Checkout GlobalProtect-openconnect
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GH_PAT }}
        repository: yuezk/GlobalProtect-openconnect
        ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gp_branch || github.ref }}
        path: gh-release/gp
        submodules: recursive

    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: gh-release/gp/.build/artifacts

    - name: Rename APK artifacts
      run: |
        shopt -s nullglob

        for file in gh-release/gp/.build/artifacts/artifact-gp-apk-amd64/*.apk; do
          mv "$file" "${file%.apk}-x86_64.apk"
        done
        for file in gh-release/gp/.build/artifacts/artifact-gp-apk-ubuntu-24.04-arm/*.apk; do
          mv "$file" "${file%.apk}-aarch64.apk"
        done

    - name: Generate release asset checksums
      env:
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' && inputs.gp_branch || 'snapshot') || github.ref_name }}
      run: |
        cd gh-release/gp
        mkdir -p .build
        scripts/release-assets.sh "$RELEASE_TAG" > .build/release-assets.txt
        if [ ! -s .build/release-assets.txt ]; then
          echo "No release assets found"
          exit 1
        fi
        while IFS= read -r file; do
          digest=$(sha256sum "$file" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$digest" "$(basename "$file")"
        done < .build/release-assets.txt > .build/release-assets.sha256

    - name: Attest release assets
      uses: actions/attest-build-provenance@v4
      with:
        subject-checksums: gh-release/gp/.build/release-assets.sha256

    - name: Create GH release
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' && inputs.gp_branch || 'snapshot') || github.ref_name }}
      run: |
        cd gh-release/gp/scripts && ./gh-release.sh "$RELEASE_TAG"

  wait-gpgui-macos:
    if: ${{ !cancelled() && needs.trigger-gpgui-macos.result == 'success' }}
    needs:
      - trigger-gpgui-macos
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Wait for private macOS build
        env:
          GH_TOKEN: ${{ secrets.GPGUI_ACTIONS_TOKEN }}
          PRIVATE_RUN_ID: ${{ needs.trigger-gpgui-macos.outputs.run_id }}
          PRIVATE_RUN_URL: ${{ needs.trigger-gpgui-macos.outputs.run_url }}
        run: |
          set -euo pipefail

          if [[ -z "$PRIVATE_RUN_ID" ]]; then
            echo "The private macOS workflow was not started" >&2
            exit 1
          fi
          for _ in $(seq 1 480); do
            run="$(gh api "repos/yuezk/gpgui/actions/runs/$PRIVATE_RUN_ID")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [[ "$status" == "completed" ]]; then
              echo "Private macOS build completed: $PRIVATE_RUN_URL"
              if [[ "$conclusion" != "success" ]]; then
                echo "Private macOS build concluded with: $conclusion" >&2
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done

          gh api --method POST \
            "repos/yuezk/gpgui/actions/runs/$PRIVATE_RUN_ID/cancel" >/dev/null || true
          echo "Private macOS build timed out: $PRIVATE_RUN_URL" >&2
          exit 1

  publish-docker-image:
    needs:
      - test-gp
      - build-docker-image
    if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.build_only) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-*
        merge-multiple: true
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    - name: Publish Docker manifest
      working-directory: /tmp/digests
      env:
        IMAGE: yuezk/globalprotect-openconnect
        RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.channel == 'stable' && inputs.gp_branch || 'snapshot') || github.ref_name }}
      run: |
        docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" \
          $(printf "$IMAGE@sha256:%s " *)

        "$GITHUB_WORKSPACE/scripts/verify-docker-publication.sh" "$IMAGE:$RELEASE_TAG" /tmp/digests all
