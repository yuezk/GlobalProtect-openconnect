name: Build Linux Native Shell

on:
  workflow_call:
    inputs:
      gp_ref:
        required: true
        type: string
      gpgui_ref:
        required: true
        type: string
      channel:
        required: true
        type: string
      build:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
        suffix: ['', '-musl']
    runs-on: ${{ matrix.platform.runner }}
    name: build (${{ matrix.platform.arch }}${{ matrix.suffix }})
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      GPGUI_BUILD_VERSION: ${{ inputs.build }}
      GPGUI_GIT_COMMIT: ${{ inputs.gpgui_ref }}
      GPGUI_UPDATE_CHANNEL: ${{ inputs.channel }}
      GPGUI_LICENSE_SIGNING_KEYS: ${{ vars.GPGUI_LICENSE_SIGNING_KEYS }}
    steps:
      - name: Checkout GlobalProtect-openconnect
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.gp_ref }}
          path: source/gp
          submodules: recursive
          persist-credentials: false
      - name: Checkout CI helpers
        uses: actions/checkout@v6
        with:
          path: .ci
          persist-credentials: false
      - name: Checkout gpgui
        uses: ./.ci/.github/actions/checkout-private
        with:
          token: ${{ secrets.GH_PAT }}
          ref: ${{ inputs.gpgui_ref }}
          path: source/gpgui
      - name: Install Ubuntu 24.04 dependencies
        if: matrix.suffix == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake gettext libtool pkg-config \
            clang libclang-dev libgtk-4-dev libxml2-dev \
            libgnutls28-dev liblz4-dev libwayland-dev libxkbcommon-dev libdbus-1-dev
          pkg-config --exists gtk4 gnutls dbus-1 wayland-client xkbcommon
      - name: Install the NSH compiler
        if: matrix.suffix == ''
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache public crate downloads
        if: matrix.suffix == ''
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: nsh-crates-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/gpgui/apps/desktop-nsh/Cargo.lock') }}
          restore-keys: nsh-crates-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and package Native Shell
        env:
          LIBC_SUFFIX: ${{ matrix.suffix }}
        run: |
          trap 'code=$?; if [ "$code" -ne 0 ]; then echo "::error::Native Shell build failed; diagnostics suppressed."; fi' EXIT
          (
            set -euo pipefail
            if [[ "$LIBC_SUFFIX" == "-musl" ]]; then
              docker run --rm --user root -v "$PWD/source:/source" -w /source/gpgui \
                -e GPGUI_BUILD_VERSION -e GPGUI_GIT_COMMIT -e GPGUI_UPDATE_CHANNEL \
                -e GPGUI_LICENSE_SIGNING_KEYS -e CARGO_INCREMENTAL -e CARGO_BUILD_JOBS \
                yuezk/gpdev:gpgui-alpine-builder-tauri2 bash -ec '
                  apk add --no-cache clang clang-dev gtk4.0-dev dbus-dev wayland-dev libxkbcommon-dev
                  rustup toolchain install 1.97.0 --profile minimal
                  ../gp/scripts/build-linux-nsh.sh
                '
            else
              cd source/gpgui
              ../gp/scripts/build-linux-nsh.sh
            fi
          ) >/dev/null 2>&1
          echo "Native Shell build and version check passed."
      - name: Verify musl archive on Alpine
        if: matrix.suffix == '-musl'
        run: |
          docker run --rm -v "$PWD/source/gpgui/.build/package:/assets:ro" alpine:3.23 sh -ec '
            apk add --no-cache gtk4.0 gnutls dbus-libs libgcc xz
            tar -xJf "/assets/gpgui-nsh_$(uname -m)-musl.bin.tar.xz"
            ./gpgui-nsh_*/gpgui-nsh --version >/dev/null 2>&1
          '
      - name: Upload Native Shell
        uses: actions/upload-artifact@v7
        with:
          name: artifact-gpgui-nsh${{ matrix.suffix }}-${{ matrix.platform.arch }}
          if-no-files-found: error
          path: |
            source/gpgui/.build/package/*.bin.tar.xz
            source/gpgui/.build/package/*.bin.tar.xz.sha256
