name: Update flake hashes

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. Defaults to Cargo.toml workspace version."
        required: false
      release_tag:
        description: "GitHub release tag to fetch assets from. Defaults to v<version>; use snapshot for snapshot assets."
        required: false

permissions:
  contents: write

jobs:
  update-flake-hashes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Checkout GlobalProtect-openconnect
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve candidate release
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PYRELEASE'
          import json, os, re, runpy, subprocess
          from pathlib import Path
          helpers = runpy.run_path('scripts/validate-release-version.py')
          version = os.environ['RELEASE_VERSION'].removeprefix('v') or helpers['cargo_version'](Path('.'))
          tag = os.environ['RELEASE_TAG'] or f'v{version}'
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version) or tag not in (f'v{version}', 'snapshot'):
              raise SystemExit('Expected a stable version and its matching release tag, or snapshot')
          source_slug = re.sub(r'[^A-Za-z0-9._-]', '', re.sub(r'[/\s]+', '-', os.environ['GITHUB_REF_NAME'])).strip('-')
          test_branch = f'chore/flake-{source_slug}'
          expected_head = ''
          if tag == 'snapshot':
              remote = subprocess.check_output(['git', 'ls-remote', '--heads', 'origin', f'refs/heads/{test_branch}'], text=True)
              expected_head = remote.split()[0] if remote.strip() else ''
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nrelease_tag={tag}\n')
          Path('release-candidate.json').write_text(json.dumps({
              'version': version, 'releaseTag': tag, 'sourceSha': os.environ['GITHUB_SHA'],
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'testBranch': test_branch, 'expectedTestHead': expected_head,
          }, indent=2) + '\n')
          PYRELEASE

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update Nixpkgs lock
        run: |
          nix flake update nixpkgs \
            --extra-experimental-features "nix-command flakes"

      - name: Update flake hashes
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            scripts/update-flake-hashes.sh "$RELEASE_VERSION" "$RELEASE_TAG"
          else
            scripts/update-flake-hashes.sh "" "$RELEASE_TAG"
          fi

      - name: Upload updated flake
        uses: actions/upload-artifact@v7
        with:
          name: updated-flake
          path: |
            flake.nix
            flake.lock
            release-candidate.json
          if-no-files-found: error

  validate-nix-prebuilt:
    needs:
      - update-flake-hashes
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
        nixpkgs:
          - locked
          - nixos-25.11
          - nixos-26.05
          - nixpkgs-unstable
        exclude:
          - runner: ubuntu-24.04-arm
            nixpkgs: locked
    name: validate-nix-prebuilt (${{ matrix.nixpkgs }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout GlobalProtect-openconnect
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
          path: .

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build prebuilt Nix package
        env:
          NIXPKGS: ${{ matrix.nixpkgs }}
        run: |
          if [[ "$NIXPKGS" == "locked" ]]; then
            nix build .#prebuilt \
              --extra-experimental-features "nix-command flakes" \
              --print-build-logs
          else
            nix build .#prebuilt \
              --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS" \
              --extra-experimental-features "nix-command flakes" \
              --print-build-logs
          fi

      - name: Validate installed release versions
        run: |
          python3 scripts/validate-release-version.py \
            --version '${{ needs.update-flake-hashes.outputs.version }}' \
            --release-tag '${{ needs.update-flake-hashes.outputs.release_tag }}' --package result

      - name: Inspect prebuilt Nix package
        run: |
          test -x result/bin/gpclient
          test -x result/bin/gpauth
          test -x result/bin/gpservice
          test -x result/bin/gpgui-helper
          test -x result/bin/gpgui
          test ! -L result/bin/gpservice
          test -x result/libexec/gpclient/gp-vpnc-script-installer
          test -x result/libexec/gpclient/gp-hip-script-installer
          result/bin/gpclient --version
          result/bin/gpservice --version
          result/bin/gpauth --version

          if grep -R '/usr/bin/gp' result/share; then
            echo "Desktop assets contain paths outside the Nix package" >&2
            exit 1
          fi

      - name: Verify desktop authorization runs on the host
        run: bash scripts/tests/nix-desktop-authorization.sh result

  publish-test-branch:
    if: needs.update-flake-hashes.outputs.release_tag == 'snapshot'
    needs: [update-flake-hashes, validate-nix-prebuilt]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GlobalProtect-openconnect
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Download updated flake
        uses: actions/download-artifact@v8
        with:
          name: updated-flake
          path: .

      - name: Publish branch for snapshot testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-flake-test-branch.sh
